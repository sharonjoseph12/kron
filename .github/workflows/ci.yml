name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (workspace packages)
        run: pnpm test

      - name: Test (API integration)
        run: pnpm --filter @kron/api test

      - name: Test (resource-server)
        run: pnpm --filter @kron/resource-server test

  localnet-e2e:
    name: LocalNet contract e2e (deploy → enforce → verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true # infra-dependent; never blocks PRs during the hackathon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace (needed for @kron/x402 deps)
        run: pnpm --filter @kron/x402... build

      - name: Start LocalNet (postgres + dev-mode algod)
        run: docker compose --profile localnet up -d postgres algod

      - name: Wait for algod health
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4001/v2/status -H 'X-Algo-API-Token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' >/dev/null; then
              echo "algod healthy"; exit 0
            fi
            sleep 2
          done
          echo "algod failed to become healthy"; exit 1

      - name: Extract funded account mnemonic from kmd
        id: funding
        shell: bash
        run: |
          set -euo pipefail
          ADDR=$(docker exec kron-algod sh -c "goal account list -w unencrypted-default-wallet -o json" | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['Address'])")
          MNEMONIC=$(docker exec kron-algod sh -c "goal account export -a $ADDR -w unencrypted-default-wallet -p ''" | grep 'Recovered:' | awk '{print $2}')
          echo "mnemonic extracted for $ADDR"
          echo "FUNDING_MNEMONIC=$MNEMONIC" >> "$GITHUB_ENV"

      - name: Run e2e smoke test against LocalNet
        working-directory: packages/x402
        env:
          ALGOD_URL: http://localhost:4001
          ALGOD_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: pnpm exec tsx scripts/e2e-localnet.ts
